<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Random HIIT and runner-focused stretching with a guided timer and session log.">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1217" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="cloud.js"></script>
<title>Workout Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: single phone column. Mode tabs, grouped settings, sectioned plan (warm-up / main / cool-down), sticky start bar; full-screen interval player overlay */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#12161C; --muted:#5B6470; --line:#D6DCE3;
  --hiit:#D9432A; --str:#1A8576; --on-accent:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --accent:var(--hiit);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1217; --surface:#171C23; --ink:#EDF0F4; --muted:#97A1AD; --line:#29303A;
  --hiit:#FF6B4F; --str:#3BBFAC; --on-accent:#0E1217; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#171C23; --ink:#EDF0F4; --muted:#97A1AD; --line:#29303A;
  --hiit:#FF6B4F; --str:#3BBFAC; --on-accent:#0E1217; color-scheme:dark }

[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
*,*::before,*::after{box-sizing:border-box}
.app{padding-top:max(20px,env(safe-area-inset-top))!important}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0}
.app[data-mode="hiit"]{--accent:var(--hiit)}
.app[data-mode="str"]{--accent:var(--str)}
.app{max-width:560px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}

header h1{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:.9;letter-spacing:.01em;text-transform:uppercase;margin:0}
header h1 span{color:var(--accent)}
header p{margin:.4rem 0 0;color:var(--muted)}

.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.tab{border:0;background:transparent;border-radius:10px;padding:10px 4px;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}

.settings{display:flex;flex-direction:column;gap:22px}
.group{display:flex;flex-direction:column;gap:12px}
.group h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.group h3::after{content:"";flex:1;height:1px;background:var(--line)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.desc{margin:0;font-size:.9rem;color:var(--muted)}
.desc a,.note a{color:var(--accent);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1 1 0;min-width:64px;text-align:center;padding:8px 6px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:500;font-size:.95rem;cursor:pointer;white-space:nowrap}
.seg input:checked+label{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.seg.auto label{flex:1 1 auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steppers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stepper{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.stepper .ctl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stepper output{font-family:var(--display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums;text-align:center;flex:1}
.stepper button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:1.3rem;line-height:1;display:grid;place-items:center}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}

.shuffle{border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:12px;padding:12px;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px}
.shuffle:active{transform:scale(.98)}

.plan{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.plan-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.plan-head h2{font-family:var(--display);font-weight:700;font-size:1.4rem;text-transform:uppercase;margin:0;letter-spacing:.02em}
.meta{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 16px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-bottom:1px solid var(--line)}
.sec-head span:first-child{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.plan ol{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:2rem 1fr auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.plan .num{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--accent);font-variant-numeric:tabular-nums}
.plan .name{font-weight:600}
.plan .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:2px}
.chip{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.reroll{border:1px solid var(--line);background:transparent;border-radius:9px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.editlist{border:0;background:transparent;padding:0;color:var(--accent);font-weight:600;font-size:inherit;text-decoration:underline;text-underline-offset:2px}
.reroll:hover{color:var(--accent);border-color:var(--accent)}
.plan .note{padding:10px 16px;font-size:.85rem;color:var(--muted)}
.empty{padding:16px;color:var(--muted)}

.startbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.startbar button{display:block;width:100%;max-width:560px;margin:0 auto;border:0;border-radius:14px;padding:16px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.06em;text-transform:uppercase}

/* Player */
.player{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));transition:background .3s;overflow-y:auto}
.app[data-mode="hiit"]~.player{--accent:var(--hiit)}
.app[data-mode="str"]~.player{--accent:var(--str)}
.player.work{background:var(--accent);color:var(--on-accent)}
.player.work .pmuted{color:inherit;opacity:.8}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pclose{border:0;background:transparent;font-weight:600;padding:6px 0}
.pprog{height:6px;border-radius:9px;background:color-mix(in srgb,currentColor 18%,transparent);margin-top:10px;overflow:hidden}
.pprog i{display:block;height:100%;background:currentColor;width:0;transition:width .3s}
.pmid{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;gap:10px;padding-block:12px}
.pvis{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
.phase{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:1.1rem}
.ring{position:relative;width:min(66vw,290px,40dvh);aspect-ratio:1;max-width:100%;flex:none}
.ring.sm{width:min(48vw,200px,30dvh)}
.pvis .ring.sm{width:min(30vw,170px,26dvh)}
.pvis .figcard{flex:0 1 auto;min-width:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .trk{stroke:color-mix(in srgb,currentColor 16%,transparent)}
.ring .bar{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;line-height:.85}
.big b{font-size:clamp(4.5rem,24vw,7.5rem)}
.ring.sm .big b{font-size:clamp(2.4rem,11vw,3.6rem)}
.pvis .ring.sm .big small{font-size:.75rem}
.big small{font-size:1rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.pname{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,7vw,2.6rem);text-transform:uppercase;line-height:1;margin:0;text-wrap:balance}
.pname em{font-style:normal;opacity:.75}
.pcue{max-width:34ch;margin:0}
.pmuted{color:var(--muted)}
.pnext{font-size:.95rem}
.alist{list-style:none;margin:0;padding:0;width:100%;max-width:340px;text-align:left}
.alist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid color-mix(in srgb,currentColor 25%,transparent);font-weight:600}
.alist li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.rounds{font-family:var(--display);font-weight:800;font-size:1.6rem;text-transform:uppercase;letter-spacing:.04em}
.pctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;align-items:center}
.pctl button{border:2px solid currentColor;background:transparent;border-radius:14px;padding:14px 6px;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.05em;text-transform:uppercase}
.pctl .main{background:currentColor}
.pctl .main span{color:var(--bg)}
.player.work .pctl .main span{color:var(--accent)}
.done-stats{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.done-stats b{display:block;font-family:var(--display);font-size:2.4rem;line-height:1}
/* Header + library button */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.libbtn{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;font-size:.95rem}
.libbtn:hover{border-color:var(--accent);color:var(--accent)}

/* Library sheet */
.sheet{position:fixed;inset:0;z-index:9;background:var(--bg);color:var(--ink);overflow-y:auto;padding-inline:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));--accent:var(--hiit)}
.sheet[data-list="str"]{--accent:var(--str)}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.sheet-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-title h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.9rem;text-transform:uppercase;line-height:1}
.done{border:0;border-radius:10px;padding:9px 16px;background:var(--accent);color:var(--on-accent);font-weight:600}
.ltabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ltabs button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 2px;font-weight:600;font-size:.85rem;color:var(--muted);white-space:nowrap}
.ltabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lsearch{display:flex;gap:8px}
.lsearch input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.addbtn{border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:600;white-space:nowrap}
.lmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.lgroup{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lgh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-bottom:1px solid var(--line)}
.lgh span{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lgh small{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;font-family:var(--body);margin-left:6px}
.lgh button{border:0;background:transparent;color:var(--muted);font-size:.85rem;font-weight:600;padding:4px 0}
.lgh button:hover{color:var(--accent)}
.litem{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.litem:last-child{border-bottom:0}
.litem.off .lname,.litem.off .lcue{opacity:.45}
.lname{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lcue{font-size:.85rem;color:var(--muted);margin-top:2px}
.lsub{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip.mine{border-color:var(--accent);color:var(--accent)}
.lact{display:flex;align-items:center;gap:10px}
.del{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 9px;font-size:.8rem;font-weight:600;color:var(--muted)}
.del.arm{border-color:var(--hiit);color:var(--hiit)}
.sw{appearance:none;-webkit-appearance:none;margin:0;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::before{transform:translateX(18px)}
.sw:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.addform{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.addform h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.2rem;text-transform:uppercase}
.addform input[type=text],.addform input[type=number],.addform select{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:16px}
.checks label{display:flex;align-items:center;gap:8px;font-weight:500}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.formrow{display:flex;gap:8px;justify-content:flex-end}
.formrow button{border-radius:10px;padding:10px 16px;font-weight:600}
.btn-ghost{border:1px solid var(--line);background:transparent}
.btn-solid{border:0;background:var(--accent);color:var(--on-accent)}
.ferr{color:var(--hiit);font-size:.9rem;margin:0}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:.9rem;pointer-events:none}
/* Diagrams */
.fig{display:block;width:100%;height:auto}
.fig line,.fig path,.fig circle,.fig rect{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .fl{stroke:var(--line);stroke-width:1.2}
.fig .pr *{stroke:var(--muted);stroke-width:1.1}
.fig .far *{stroke:var(--ink);opacity:.35;stroke-width:2.6}
.fig .bd *,.fig .nr *{stroke:var(--ink);stroke-width:2.8}
.fig .bd .hd{fill:var(--figbg,var(--surface))}
.fig .hl *{stroke:var(--accent);stroke-width:3.4}
.fig .hl .hlf{fill:var(--accent);stroke:none}
.fig .ahf{fill:var(--muted);stroke:none}
.thumb{--figbg:var(--bg);width:64px;aspect-ratio:5/4;background:var(--bg);border-radius:8px;overflow:hidden;flex:none}
.plan li.hasfig{grid-template-columns:2rem 64px 1fr auto}
.litem.hasfig{grid-template-columns:64px 1fr auto}
.figcard{--figbg:var(--surface);background:var(--surface);border-radius:16px;width:min(54vw,300px,34dvh);padding:4px 8px;flex:none}
.hbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.hbtns .libbtn{justify-content:flex-start}
/* Session log */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em}
.mnav button{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:1.3rem;line-height:1}
.mnav button:disabled{opacity:.35;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px;min-width:0}
.stat span{display:block;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
.stat small{display:block;font-size:.76rem;color:var(--muted);margin-top:2px}
.stat.hiit b{color:var(--hiit)}
.stat.str b{color:var(--str)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h span{text-align:center;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-bottom:4px}
.day{aspect-ratio:1/1.08;min-width:0;border:0;border-radius:9px;background:transparent;display:flex;flex-direction:column;align-items:center;padding:5px 0 0;gap:4px;font-variant-numeric:tabular-nums;font-weight:500;font-size:.9rem;color:var(--ink)}
.day.has{background:color-mix(in srgb,var(--ink) 6%,transparent);font-weight:700}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.future{color:var(--muted)}
.day.sel{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:92%}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.hiit{background:var(--hiit)}
.dot.str{background:var(--str)}
.day.sel .dot{box-shadow:0 0 0 1.5px var(--bg)}
.more{font-size:.6rem;line-height:7px;font-weight:700}
.legend{display:flex;gap:16px;justify-content:center;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.sess{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:0}
.sess .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;width:3.2em}
.sess .tt{font-weight:600}
.sess .chip.hiit{border-color:var(--hiit);color:var(--hiit)}
.sess .chip.str{border-color:var(--str);color:var(--str)}
.brk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.brk:last-child{border-bottom:0}
.brk .bn{font-weight:600;min-width:0}
.brk .bc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.brk .bar{grid-column:1/-1;height:6px;border-radius:9px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}
.brk .bar i{display:block;height:100%;border-radius:9px}
.brk .bar i.hiit{background:var(--hiit)}
.brk .bar i.str{background:var(--str)}
.savebar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:600}
.savebar button{border:2px solid currentColor;background:transparent;border-radius:10px;padding:7px 12px;font-weight:600}

@media (max-height:700px){.pmid{gap:6px;padding-block:8px}.pcue{font-size:.92rem}.phase{font-size:1rem}.pctl button{padding:11px 6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function amount(e,lvl,f=1){
 const v=e.r*[.7,1,1.35][lvl]*f;

 const step=e.r>=20?2:1;return Math.max(3,Math.round(v/step)*step);
}

// pick n items, spreading groups and avoiding the same group twice in a row
function pickSeq(pool,n){
 const out=[];const rest=shuffle(pool);
 while(out.length<n&&rest.length){
  const last=out[out.length-1],counts={};
  out.forEach(e=>counts[e.g]=(counts[e.g]||0)+1);
  rest.sort((a,b)=>(counts[a.g]||0)-(counts[b.g]||0));
  let i=rest.findIndex(e=>!last||e.g!==last.g);if(i<0)i=0;
  out.push(rest[i]);rest.splice(i,1);
 }
 return out;
}

// fill in form tips from the stretch library where a routine doesn't give one
Object.values(GOALS).forEach(g=>g.slots.forEach(sl=>sl.forEach(e=>{if(!e.c){const m=STR.find(x=>x.n===e.n);e.c=m?m.c:""}})));
// ---------- Shortening goal routines ----------
// priority per slot: 1 = always keep, 2 = drop if needed, 3 = first to go
const PRIO={calfhip:[2,1,1,3,2,1,1,3,2,2,1,3],pf:[2,1,1,1,3,1,1,2],postrun:[1,1,1,1,1,2,2,3,3],back:[1,1,2,1,2,2,1,3],desk:[1,1,1,2,2,3,2,3],prerun:[1,2,2,1,2,1,2,3]};
function estGoal(L){
 return 10+L.reduce((a,e)=>{const n=e.side?2:1,r=e.t==="reps",w=r?e.reps*3:e.sec;
  return a+e.sets*(n*w+(n-1)*(r?8:4))+(e.sets-1)*(r?20:6)},0)+8*Math.max(0,L.length-1);
}
function fitGoal(full,glen,gk){
 const L=full.map(e=>({...e})),dropped=[],T=glen*60;
 if(glen==="full"||estGoal(L)<=T)return{main:L,dropped,cut:false};
 const pr=e=>(PRIO[gk]||[])[e._slot]||2,over=()=>estGoal(L)>T;
 const drop=p=>{for(let i=L.length-1;i>=0&&over()&&L.length>3;i--)if(pr(L[i])===p){dropped.unshift(L[i].n);L.splice(i,1)}};
 const trim=min=>{let moved=true;while(over()&&moved){moved=false;for(const e of L){if(e.t!=="reps"&&e.sec>min&&over()){e.sec-=5;moved=true}}}};
 // fewer sets first, lowest-priority exercises first
 const bySets=[...L].sort((a,b)=>pr(b)-pr(a)||b._slot-a._slot);
 for(const e of bySets){while(e.sets>1&&over())e.sets--}
 if(over())drop(3);
 if(over())trim(30);
 if(over())drop(2);
 if(over())trim(20);
 if(over())drop(1);
 return{main:L,dropped,cut:true};
}
function goalPlan(gk,pick){
 const G=GOALS[gk],full=G.slots.map((sl,i)=>({...sl[pick[i]],_slot:i}));
 const f=fitGoal(full,S.o.str.glen,gk);
 return{mode:"str",goal:gk,pick,full,main:f.main,dropped:f.dropped,cut:f.cut};
}
const goalAmt=e=>e.t==="reps"?`${e.sets} × ${e.reps}${e.side?" each side":""}`:`${e.sec}s${e.side?" each side":""}${e.sets>1?` × ${e.sets}`:""}`;

// ---------- Generate ----------
function mainCount(o){return {int:o.moves,tabata:o.blocks*2,emom:o.emMoves,amrap:o.amMoves}[o.fmt]}
function generate(){
 const m=S.mode,o=S.o[m];
 if(m==="hiit"){
  S.plan={mode:m,
   warm:o.warm?pickSeq(warmPool(o),o.warm*60/WARM_T):[],
   main:pickSeq(hiitPool(o),mainCount(o)),
   cool:o.cool?fillStretches(active("cool").filter(runOK),o.cool*60,COOL_HOLD):[]};
 }else if(o.smode==="goal"){
  const G=GOALS[o.goal],pick=G.slots.map(sl=>Math.random()*sl.length|0);
  S.plan=goalPlan(o.goal,pick);
 }else{
  S.plan={mode:m,main:fillStretches(strPool(o),o.dur*60,o.hold)};
 }
 render();
}
function reroll(sec,i){
 const P=S.plan,o=S.o[P.mode],list=P[sec],cur=list[i];
 if(P.goal){const si=list[i]._slot,sl=GOALS[P.goal].slots[si];P.pick[si]=(P.pick[si]+1)%sl.length;S.plan=goalPlan(P.goal,P.pick);return render()}
 const base=P.mode==="str"?strPool(o):sec==="warm"?warmPool(o):sec==="cool"?active("cool").filter(runOK):hiitPool(o);
 const p=base.filter(e=>!list.includes(e));
 const same=p.filter(e=>e.g===cur.g);
 const c=shuffle(same.length?same:p)[0];
 if(c){list[i]=c;render()}
}

// ---------- Timing ----------
function hiitTiming(o){
 const [w,r]=o.preset==="c"?[o.work,o.rest]:PRESETS[o.preset];
 return{w,r,brk:o.preset==="c"?o.brk:60};
}
function steps(){
 const P=S.plan,o=S.o[P.mode],st=[];
 st.push({k:"ready",t:10});
 const stretchSteps=(list,hold,phase,easy)=>list.forEach((e,i)=>{
  if(e.s){st.push({k:"work",t:hold,ex:e,info:"Left side",phase,easy});st.push({k:"rest",t:4,label:"Switch sides"});st.push({k:"work",t:hold,ex:e,info:"Right side",phase,easy})}
  else st.push({k:"work",t:hold,ex:e,info:"Hold",phase,easy});
  if(i<list.length-1)st.push({k:"rest",t:4,label:"Next stretch"});
 });
 if(P.goal){
  const PH={stretch:"Stretch",mobility:"Mobility",dynamic:"Move",strength:"Strength"};
  P.main.forEach((e,i)=>{
   const phase=PH[e.k],sides=e.side?["Left side","Right side"]:[""];
   for(let set=0;set<e.sets;set++){
    const setTxt=e.sets>1?`Set ${set+1} of ${e.sets}`:"";
    sides.forEach((sdTxt,j)=>{
     const info=[sdTxt,setTxt].filter(Boolean).join(" · ")||(e.t==="hold"?"Hold":"");
     if(e.t==="reps")st.push({k:"reps",reps:e.reps,ex:e,info,phase});
     else st.push({k:"work",t:e.sec,ex:e,info,phase});
     if(j<sides.length-1)st.push({k:"rest",t:e.t==="reps"?8:4,label:"Switch sides"});
    });
    if(set<e.sets-1)st.push({k:"rest",t:e.t==="reps"?20:6,label:e.t==="reps"?"Rest":"Again"});
   }
   if(i<P.main.length-1)st.push({k:"rest",t:8,label:"Next up"});
  });
  return st;
 }
 if(P.mode==="str"){stretchSteps(P.main,o.hold,"Stretch");return st}

 P.warm.forEach((e,i)=>st.push({k:"work",t:WARM_T,ex:e,info:`Warm-up ${i+1} of ${P.warm.length}`,phase:"Warm-up",easy:1}));
 if(P.warm.length)st.push({k:"rest",t:15,label:"Main workout next"});

 const M=P.main,lv=o.level;
 if(o.fmt==="int"){
  const {w,r,brk}=hiitTiming(o);
  for(let rd=0;rd<o.rounds;rd++)M.forEach((e,i)=>{
   st.push({k:"work",t:w,ex:e,info:`Round ${rd+1} of ${o.rounds}`});
   const lastIn=i===M.length-1,end=lastIn&&rd===o.rounds-1;
   if(end)return;
   if(lastIn){if(brk)st.push({k:"rest",t:brk,label:"Round break"})}
   else if(r)st.push({k:"rest",t:r,label:"Rest"});
  });
 }else if(o.fmt==="tabata"){
  for(let b=0;b<o.blocks;b++){
   for(let rd=0;rd<8;rd++){
    st.push({k:"work",t:20,ex:M[b*2+rd%2]||M[0],info:`Block ${b+1} · Round ${rd+1} of 8`});
    if(rd<7)st.push({k:"rest",t:10,label:"Rest"});
   }
   if(b<o.blocks-1)st.push({k:"rest",t:60,label:"Block break"});
  }
 }else if(o.fmt==="emom"){
  for(let mn=0;mn<o.emMin;mn++){const e=M[mn%M.length];st.push({k:"emom",t:60,ex:e,amt:amount(e,lv,.8),info:`Minute ${mn+1} of ${o.emMin}`})}
 }else{
  st.push({k:"amrap",t:o.amMin*60,list:M.map(e=>({ex:e,amt:amount(e,lv)}))});
 }

 if(P.cool.length){st.push({k:"rest",t:15,label:"Cool-down next"});stretchSteps(P.cool,COOL_HOLD,"Cool-down",1)}
 return st;
}
const estimate=st=>st.reduce((a,s)=>a+(s.t||(s.reps?s.reps*3:0)),0);

const LIM={moves:[3,10,1],rounds:[1,10,1],work:[10,90,5],rest:[0,60,5],brk:[0,180,15],blocks:[1,6,1],emMin:[4,30,1],emMoves:[1,5,1],amMin:[5,30,1],amMoves:[3,6,1]};

const group=(t,h)=>`<div class="group"><h3>${t}</h3>${h}</div>`;
function lenSeg(o){

 const opts=[["full",`Full · ${fullMin} min`],...[15,10,5].filter(n=>n<fullMin-1).map(n=>[n,n+" min"])];
 if(!opts.some(x=>String(x[0])===String(o.glen)))o.glen="full";
 return opts.length>1?seg("glen","Length",opts,"auto"):"";
}

  if(o.smode==="goal")h=routine;

    group("Stretches",seg("focus","Focus",[["full","Full body"],["upper","Upper"],["lower","Lower & hips"],["back","Back"]],"auto")+

 }

const RE=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>`;
function rows(sec,list,sub,canSwap=()=>true){
 return `<ol>${list.map((e,i)=>{const f=figure(e.fig||e.n);return `<li${f?' class="hasfig"':""}><span class="num">${String(i+1).padStart(2,"0")}</span>${f?`<div class="thumb">${f}</div>`:""}<div style="min-width:0"><div class="name">${esc(e.n)}</div><div class="sub">${sub(e,i)}</div></div>

const secHead=(t,m,lib)=>`<div class="sec-head"><span>${t}</span><span class="meta">${m}${lib?` · <button type="button" class="editlist" data-lib="${lib}">Edit list</button>`:""}</span></div>`;

 if(!P.main.length){$("plan").innerHTML=`<div class="empty">No exercises match these filters. Try a different focus or position, or switch more moves on in the Library.</div>`;return}

   `<div class="note">${cutNote}${G.note?G.note+" ":""}The swap button switches to an alternative exercise that does the same job. Strength sets wait for you to tap Done.</div>`;
  return;
 }
 if(P.mode==="str"){
  $("plan").innerHTML=`<div class="plan-head"><h2>${P.main.length} stretches</h2><span class="meta">${o.hold}s holds · ~${mins(est)}</span></div>`+
   rows("main",P.main,e=>`<span class="chip">${e.g}</span>${o.hold}s${e.s?" each side":""}`)+
   `<div class="note">Breathe slowly and ease into each stretch. Mild tension, never pain.</div>`;
  return;
 }
 const lv=o.level;let title,mainMeta,note,sub;
 if(o.fmt==="int"){
  const {w,r,brk}=hiitTiming(o);

  note=`Do the moves back to back, then ${brk?`take a ${brk}s break`:"go straight"} into the next round.`;

  sub=(e,i)=>`<span class="chip">Block ${Math.floor(i/2)+1}</span>4 × 20s`;
 }else if(o.fmt==="emom"){

  sub=(e,i)=>{const ms=[];for(let m=i;m<o.emMin;m+=P.main.length)ms.push(m+1);
   return `<span class="chip">${e.g}</span>${amtLabel(e,amount(e,lv,.8))} · min ${ms.length>4?ms.slice(0,4).join(", ")+"…":ms.join(", ")}`};
 }else{

 }
 let h=`<div class="plan-head"><h2>${title}</h2><span class="meta">~${mins(est)} total</span></div>`;
 if(P.warm.length)h+=secHead("Warm-up",`${P.warm.length} × ${WARM_T}s`,"warm")+rows("warm",P.warm,e=>`${WARM_T}s${e.c?" · "+esc(e.c):""}`);

// One record per finished session; stored as one document per month in your private space.
let LOG=[];try{LOG=(JSON.parse(localStorage.getItem("wr-log")||"[]")||[]).filter(x=>x&&x.id&&x.at)}catch(e){}
let LOGCOL=null;
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const monthKey=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const dayKey=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const durTxt=sec=>{const m=Math.round(sec/60);if(m<60)return m+" min";return Math.floor(m/60)+"h "+(m%60)+"m"};
function saveLogLocal(){try{localStorage.setItem("wr-log",JSON.stringify(LOG))}catch(e){}}
function syncMonth(mk){
 if(!LOGCOL)return;
 const list=LOG.filter(x=>monthKey(x.at)===mk).map(({pend,...r})=>r);
 const ref=LOGCOL.doc("log-"+mk);
 (list.length?ref.set({month:mk,sessions:list}):ref.delete()).then(()=>{
  let ch=false;LOG.forEach(x=>{if(x.pend&&monthKey(x.at)===mk){delete x.pend;ch=true}});if(ch)saveLogLocal();
 }).catch(err=>{if(err&&err.code==="quota_exceeded")toast("Couldn't save to your account: storage is full")});
}
function addSession(rec){if(!LOGCOL)rec.pend=true;LOG.push(rec);LOG.sort((a,b)=>a.at-b.at);saveLogLocal();syncMonth(monthKey(rec.at))}
function removeSession(id){const r=LOG.find(x=>x.id===id);if(!r)return null;LOG=LOG.filter(x=>x.id!==id);saveLogLocal();syncMonth(monthKey(r.at));return r}
async function connectLog(col){
 try{
  const qs=await col.get(),remote=[];
  qs.docs.forEach(d=>{if(d.id.startsWith("log-")){const ss=d.data()?.sessions;if(Array.isArray(ss))remote.push(...ss.filter(x=>x&&x.id&&x.at))}});
  const ids=new Set(remote.map(x=>x.id)),pending=LOG.filter(x=>x.pend&&!ids.has(x.id));
  LOG=[...remote,...pending].sort((a,b)=>a.at-b.at);LOGCOL=col;saveLogLocal();
  [...new Set(pending.map(x=>monthKey(x.at)))].forEach(syncMonth);
  if(!$("log").hidden)renderLog();
 }catch(e){}
}
function sessionTitle(P){
 if(P.mode==="hiit")return FORMATS[S.o.hiit.fmt].name+" HIIT";
 return P.goal?GOALS[P.goal].name:"Stretch mix";
}
const LG={y:0,m:0,sel:null,armed:null};
function monthSessions(y,m){return LOG.filter(x=>{const d=new Date(x.at);return d.getFullYear()===y&&d.getMonth()===m})}
function streakEnding(today){
 const days=new Set(LOG.map(x=>dayKey(new Date(x.at))));
 const d=new Date(today);if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);
 let n=0;while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}
 return n;
}
function bestStreakIn(list){
 const days=[...new Set(list.map(x=>new Date(x.at).getDate()))].sort((a,b)=>a-b);
 let best=0,run=0,prev=-9;days.forEach(d=>{run=d===prev+1?run+1:1;best=Math.max(best,run);prev=d});return best;
}
function renderLog(){
 const {y,m}=LG,now=new Date(),isNow=y===now.getFullYear()&&m===now.getMonth();
 const list=monthSessions(y,m),py=m?y:y-1,pm=m?m-1:11,prev=monthSessions(py,pm);
 const daysIn=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7;
 const byDay={};list.forEach(x=>{const d=new Date(x.at).getDate();(byDay[d]=byDay[d]||[]).push(x)});
 const nH=list.filter(x=>x.mode==="hiit").length,nS=list.length-nH,secs=list.reduce((a,x)=>a+(x.secs||0),0);
 const active=Object.keys(byDay).length,elapsed=isNow?now.getDate():daysIn;
 const diff=list.length-prev.length,pmName=MONTHS[pm].slice(0,3);
 const cmp=!prev.length?(list.length?`none in ${pmName}`:"&nbsp;"):diff>0?`+${diff} vs ${pmName}`:diff<0?`${diff} vs ${pmName}`:`same as ${pmName}`;
 const streak=isNow?streakEnding(now):bestStreakIn(list);
 const isFuture=new Date(y,m,1)>now;
 const stats=`<div class="stats">
  <div class="stat"><span>Sessions</span><b>${list.length}</b><small>${cmp}</small></div>
  <div class="stat str"><span>Stretch</span><b>${nS}</b><small>routines</small></div>
  <div class="stat hiit"><span>HIIT</span><b>${nH}</b><small>workouts</small></div>
  <div class="stat"><span>Time</span><b>${secs?durTxt(secs).replace(" min","<small style='display:inline;font-size:.9rem'> min</small>"):"0"}</b><small>in total</small></div>
  <div class="stat"><span>Active days</span><b>${active}</b><small>of ${elapsed} day${elapsed===1?"":"s"}</small></div>
  <div class="stat"><span>${isNow?"Streak":"Best streak"}</span><b>${streak}</b><small>day${streak===1?"":"s"} in a row</small></div></div>`;
 let cells="";for(let i=0;i<offset;i++)cells+=`<span></span>`;
 for(let d=1;d<=daysIn;d++){
  const ss=byDay[d]||[],dt=new Date(y,m,d),fut=dt>now&&!(isNow&&d===now.getDate());
  const cls=["day",ss.length?"has":"",isNow&&d===now.getDate()?"today":"",fut?"future":"",LG.sel===d?"sel":""].filter(Boolean).join(" ");
  const dots=ss.slice(0,3).map(x=>`<i class="dot ${x.mode}"></i>`).join("")+(ss.length>3?`<i class="more">+${ss.length-3}</i>`:"");
  cells+=`<button type="button" class="${cls}" data-g="day" data-d="${d}" aria-label="${d} ${MONTHS[m]}: ${ss.length} session${ss.length===1?"":"s"}">${d}<span class="dots">${dots}</span></button>`;
 }
 const cal=`<div class="cal"><div class="cal-h">${WD.map(w=>`<span>${w}</span>`).join("")}</div><div class="cal-g">${cells}</div>
  <div class="legend"><span><i class="dot str"></i>Stretch</span><span><i class="dot hiit"></i>HIIT</span></div></div>`;
 let day="";
 if(LG.sel){
  const ss=byDay[LG.sel]||[],dt=new Date(y,m,LG.sel);
  const head=`${WD[(dt.getDay()+6)%7]} ${LG.sel} ${MONTHS[m]}`;
  day=`<section class="lgroup"><div class="lgh"><span>${head}<small>${ss.length} session${ss.length===1?"":"s"}</small></span></div>${ss.length?ss.map(x=>{
   const t=new Date(x.at),hm=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
   return `<div class="sess"><span class="tm">${hm}</span><div style="min-width:0"><div class="tt">${esc(x.title)}</div><div class="lsub"><span class="chip ${x.mode}">${x.mode==="hiit"?"HIIT":"Stretch"}</span><span class="chip">${durTxt(x.secs||0)}</span>${x.rounds!=null?`<span class="chip">${x.rounds} rounds</span>`:""}${x.early?`<span class="chip">Ended early</span>`:""}</div></div>
    <button type="button" class="del${LG.armed===x.id?" arm":""}" data-g="del" data-id="${esc(x.id)}">${LG.armed===x.id?"Confirm":"Delete"}</button></div>`}).join(""):`<p class="empty">No sessions on this day.</p>`}</section>`;
 }
 const groups={};list.forEach(x=>{const k=x.title;groups[k]=groups[k]||{n:0,secs:0,mode:x.mode};groups[k].n++;groups[k].secs+=x.secs||0});
 const rows=Object.entries(groups).sort((a,b)=>b[1].n-a[1].n),max=rows.length?rows[0][1].n:1;
 const brk=rows.length?`<section class="lgroup"><div class="lgh"><span>By routine<small>${MONTHS[m]}</small></span></div>${rows.map(([k,g])=>`<div class="brk"><span class="bn">${esc(k)}</span><span class="bc">${g.n}× · ${durTxt(g.secs)}</span><span class="bar"><i class="${g.mode}" style="width:${g.n/max*100}%"></i></span></div>`).join("")}</section>`:
  `<p class="empty">${isFuture?"This month hasn't started yet.":`No sessions logged in ${MONTHS[m]}. Finish a workout and it appears here automatically.`}</p>`;
 const nextOff=y>now.getFullYear()||(y===now.getFullYear()&&m>=now.getMonth());
 $("log").innerHTML=`<div class="sheet-in"><div class="sheet-top"><div class="sheet-title"><h2>Session log</h2><button type="button" class="done" data-g="close">Done</button></div>
  <div class="mnav"><button type="button" data-g="prev" aria-label="Previous month">‹</button><h3>${MONTHS[m]} ${y}</h3><button type="button" data-g="next" aria-label="Next month" ${nextOff?"disabled":""}>›</button></div></div>
  ${stats}${cal}${day}${brk}
  <div class="lfoot"><span>${LOGCOL&&window.Cloud&&Cloud.user?`Synced to your account · ${esc(Cloud.user.email||"")}`:"Your log saves on this device only. Sign in at the top of the app to sync."}</span>
   ${window.Cloud&&Cloud.user?`<button type="button" class="del${LG.armed==="__out"?" arm":""}" data-g="signout">${LG.armed==="__out"?"Confirm sign out":"Sign out"}</button>`:""}</div>
  <section class="lgroup"><div class="lgh"><span>Backup</span></div>
   <div class="litem"><div><div class="lname">Export or import your data</div><div class="lcue">A file with your log, switched-off moves and your own exercises. Import adds anything missing and never deletes.</div></div>

  <input type="file" id="importFile" accept=".json,application/json" hidden></div>`;
}

 if(g==="signout"){if(LG.armed!=="__out"){LG.armed="__out";return renderLog()}LG.armed=null;Cloud.signOut();$("log").hidden=true;toast("Signed out. Your data stays in your account.");return}
 if(g==="export")return exportData();
 if(g==="import")return $("importFile").click();
 if(g==="del"){const id=b.dataset.id;if(LG.armed!==id){LG.armed=id;return renderLog()}LG.armed=null;const r=removeSession(id);renderLog();if(r)toast("Deleted "+r.title)}
});

// ---------- Player ----------
let PL=null,timer=null,ac=null,lock=null;
function beep(f=880,d=.12,v=.25){
 try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="square";
 g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
 o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}
async function wake(on){
 try{if(on&&"wakeLock" in navigator)lock=await navigator.wakeLock.request("screen");else if(!on&&lock){lock.release();lock=null}}catch(e){}
}
const isWork=s=>s.k==="work"||s.k==="emom"||s.k==="amrap"||s.k==="reps";
function startPlayer(){
 if(!S.plan||!S.plan.main.length)return;
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
 PL={st:steps(),i:0,rem:0,run:true,total:0,last:performance.now(),rounds:0,
  meta:{mode:S.plan.mode,title:sessionTitle(S.plan),moves:S.plan.main.length,amrap:S.plan.mode==="hiit"&&S.o.hiit.fmt==="amrap"}};
 load(0);$("player").hidden=false;wake(true);
 clearInterval(timer);timer=setInterval(tick,200);
}
function load(i){
 PL.i=i;const s=PL.st[i];PL.rem=s.t;
 if(isWork(s))beep(1040,.35,.3);else if(i>0)beep(520,.3,.25);
 draw();
}
function nextWork(i){for(let j=i+1;j<PL.st.length;j++)if(isWork(PL.st[j]))return PL.st[j];return null}
function tick(){
 const now=performance.now(),dt=(now-PL.last)/1000;PL.last=now;
 if(!PL.run||PL.fin)return;
 PL.total+=dt;
 if(PL.st[PL.i].k==="reps"){draw();return}
 const before=Math.ceil(PL.rem);PL.rem-=dt;const after=Math.ceil(PL.rem);
 if(after!==before&&after>0&&after<=3)beep(700,.1,.2);
 if(PL.rem<=0){advance(1);return}
 draw();
}
function advance(d){
 const j=PL.i+d;
 if(j<0)return load(0);
 if(j>=PL.st.length)return finish();
 load(j);
}
function finish(early){
 PL.fin=true;PL.early=!!early;wake(false);
 if(!early){beep(660,.15);setTimeout(()=>beep(880,.15),180);setTimeout(()=>beep(1175,.4),360)}
 const M=PL.meta;
 PL.rec={id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:Date.now(),mode:M.mode,title:M.title,secs:Math.round(PL.total),moves:M.moves};
 if(M.amrap)PL.rec.rounds=PL.rounds;
 if(early)PL.rec.early=true;
 PL.saved=false;
 if(!early&&PL.total>=60){addSession(PL.rec);PL.saved=true}
 drawFinish();
}
function drawFinish(){
 const M=PL.meta,pl=$("player");pl.className="player work";
 const n=new Date(),cnt=monthSessions(n.getFullYear(),n.getMonth()).length;
 const save=PL.saved?`<div class="savebar"><span>Saved to your log · ${cnt} this month</span><button data-a="unsave">Don't save</button></div>`
  :`<div class="savebar"><span>${PL.early?"Ended early.":PL.total<60?"Under a minute, not saved.":"Not saved."}</span><button data-a="save">Save to log</button></div>`;
 pl.innerHTML=`<div class="ptop"><span></span><button class="pclose" data-a="close">Close</button></div>
 <div class="pmid"><div class="phase">${PL.early?"Session ended":"Workout complete"}</div><h2 class="pname">${PL.early?esc(M.title):"Nice work"}</h2>
 <div class="done-stats"><div><b>${fmt(PL.total)}</b>time</div>${M.amrap?`<div><b>${PL.rounds}</b>rounds</div>`:`<div><b>${M.moves}</b>${M.mode==="str"?"exercises":"moves"}</div>`}</div>${save}</div>
 <div class="pctl" style="grid-template-columns:1fr 1fr"><button data-a="close">Done</button><button class="main" data-a="again"><span>Another</span></button></div>`;
}
const C=2*Math.PI*45;
const ring=(pct,big,small,sm)=>`<div class="ring${sm?" sm":""}"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="45"/><circle class="bar" cx="50" cy="50" r="45" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.max(0,Math.min(1,pct)))}"/></svg><div class="big"><b>${big}</b>${small?`<small>${small}</small>`:""}</div></div>`;
function draw(){
 const s=PL.st[PL.i],pl=$("player"),w=isWork(s);
 pl.className="player"+(w&&!s.easy?" work":"");
 const prog=PL.i/PL.st.length*100,pct=s.k==="reps"?1:PL.rem/s.t;
 const top=`<div class="ptop"><span class="pmuted" style="font-variant-numeric:tabular-nums">${fmt(PL.total)}</span><button class="pclose" data-a="end">End</button></div><div class="pprog"><i style="width:${prog}%"></i></div>`;
 const pause=`<button data-a="toggle">${PL.run?"Pause":"Resume"}</button>`;
 if(s.k==="amrap"){
  pl.innerHTML=top+`<div class="pmid"><div class="phase">AMRAP</div>${ring(pct,fmt(PL.rem),"left",1)}
   <div class="rounds">${PL.rounds} round${PL.rounds===1?"":"s"} done</div>
   <ul class="alist">${s.list.map(x=>`<li><span>${esc(x.ex.n)}</span><span>${amtLabel(x.ex,x.amt)}</span></li>`).join("")}</ul></div>
   <div class="pctl">${pause}<button class="main" data-a="round"><span>+1 Round</span></button><button data-a="next">Finish</button></div>`;
  return;
 }
 const nx=nextWork(PL.i),ex=w?s.ex:nx&&(nx.ex||(nx.list&&{n:"AMRAP",c:nx.list.map(x=>x.ex.n).join(", ")}));
 let phase,big=Math.ceil(PL.rem),small="",name=ex?esc(ex.n):"",cue=ex?esc(ex.c):"";
 if(s.k==="ready")phase="Get ready";
 else if(s.k==="rest")phase=s.label;
 else if(s.k==="emom"){phase="EMOM";small="sec left";name=`${s.ex.h?s.amt+"s":s.amt+" ×"} <em>${esc(s.ex.n)}</em>`;cue=`<strong>${s.info}.</strong> ${s.ex.e?"Each side. ":""}${esc(s.ex.c)}`}
 else if(s.k==="reps"){phase=s.phase||"Your set";big=s.reps;small="reps";cue=(s.info?`<strong>${s.info}.</strong> `:"")+esc(s.ex.c)}
 else{phase=s.phase||"Work";small="seconds";cue=(s.info?`<strong>${s.info}.</strong> `:"")+esc(s.ex.c)}
 if(!w&&nx&&nx.k==="emom")name=`${nx.ex.h?nx.amt+"s":nx.amt+" ×"} <em>${esc(nx.ex.n)}</em>`;
 const after=w?nextWork(PL.i):null,afterName=after&&(after.ex?esc(after.ex.n):"AMRAP");
 const fg=ex&&!ex.list?figure(ex.fig||ex.n):"";
 pl.innerHTML=top+`<div class="pmid"><div class="phase">${phase}</div>${fg?`<div class="pvis">${ring(pct,big,small,1)}<div class="figcard">${fg}</div></div>`:ring(pct,big,small)}
  ${ex?`<div>${w?"":`<div class="pmuted pnext">Up next</div>`}<h2 class="pname">${name}</h2></div><p class="pcue ${w?"":"pmuted"}">${cue}</p>`:""}
  ${w&&after&&afterName!==s.ex.n?`<div class="pnext pmuted">Then: ${afterName}</div>`:""}</div>
  <div class="pctl"><button data-a="prev">Back</button>${s.k==="reps"?`<button class="main" data-a="next"><span>Done</span></button>`:`<button class="main" data-a="toggle"><span>${PL.run?"Pause":"Resume"}</span></button>`}<button data-a="next">Skip</button></div>`;
}
$("player").addEventListener("click",e=>{
 const a=e.target.closest("[data-a]")?.dataset.a;if(!a)return;
 if(a==="end"&&!PL.fin&&PL.total>=60){finish(true);return}
 if(a==="close"||a==="end"){clearInterval(timer);wake(false);$("player").hidden=true;PL=null}
 else if(a==="save"){addSession(PL.rec);PL.saved=true;drawFinish()}
 else if(a==="unsave"){removeSession(PL.rec.id);PL.saved=false;drawFinish()}
 else if(a==="again"){generate();startPlayer()}
 else if(a==="toggle"){PL.run=!PL.run;draw()}
 else if(a==="round"){PL.rounds++;beep(990,.12,.25);draw()}
 else if(a==="prev")advance(-1);
 else if(a==="next")advance(1);
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&PL&&!PL.fin)wake(true)});
$("start").onclick=startPlayer;

renderSettings();generate();connectLib();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
